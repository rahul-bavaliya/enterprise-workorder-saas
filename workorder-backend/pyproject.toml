[project]
name = "workorder-backend"
version = "0.1.0"
description = "Enterprise SaaS Work-Order System with Applied AI & Analytics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "redis>=5.0.2",
    "celery>=5.3.6",
    "langgraph>=0.1.0",
    "langchain>=0.1.16",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.13",
    "python-json-logger>=4.2.0",
    "greenlet>=3.5.6",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Add this section so fastapi-cli automatically finds your entrypoint
[tool.fastapi]
entrypoint = "app.main:app"
